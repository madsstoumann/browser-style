<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="/dist/demo.5aac056f.min.css">
<style>
	main { max-width: 64rem; margin: 2rem auto; display: grid; grid-template-columns: 1fr 1fr; gap: 3rem 4rem; }
	.wide { grid-column: 1 / -1; }
	/* candidate C: card shrinks, overflow untouched (hidden) */
	ui-card:where([media*="arw(out)"]) {
		inline-size: calc(round(down, 100%, 1px) - 2 * (var(--ui-carousel-arrow-size, 2.25rem) + var(--ui-carousel-outside-gap, 0.5rem)));
		margin-inline: auto;
	}
	/* neutralise the current frame shrink (host arm) */
	ui-card[media*="arw(out)"] ui-media { inline-size: 100%; margin-inline: 0; }
	/* bare ink candidate */
	ui-card:where([media*="arw(out)"][media*="arw(bare)"]) {
		--ui-carousel-arrow-color: color-mix(in oklab, var(--ui-carousel-controls-ink, currentColor) 80%, transparent);
		--ui-carousel-arrow-color-hover: var(--ui-carousel-controls-ink, currentColor);
	}
	/* card-anchor candidate: inline edges from the CARD, block centre from the media */
	ui-card:where([media*="arw(out)"]) { anchor-name: --ui-card-out; anchor-scope: --ui-card-out; }
	ui-card[media*="arw(out)"] ui-media::scroll-button(inline-start) { inset-inline-start: calc(anchor(--ui-card-out self-start) - var(--ui-carousel-outside-gap, 0.5rem) - var(--ui-carousel-arrow-size)); }
	ui-card[media*="arw(out)"] ui-media::scroll-button(inline-end) { inset-inline-end: calc(anchor(--ui-card-out self-end) - var(--ui-carousel-outside-gap, 0.5rem) - var(--ui-carousel-arrow-size)); }
</style></head><body><main>
