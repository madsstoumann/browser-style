<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
	<title>Editor Card - Demo</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Editor Card — every schema type, loaded from the card corpus">
	<meta name="view-transition" content="same-origin">
	<link rel="stylesheet" href="/ui/base/index.css">
	<script type="importmap">
		{
			"imports": {
				"@browser.style/editor-shared": "../shared/index.js"
			}
		}
	</script>
	<style>
		.demo-controls { display: flex; gap: 1rem; align-items: end; flex-wrap: wrap; margin-block-end: 2rem; }
		.demo-controls label { display: grid; gap: .25rem; }
		#roundtrip[data-state="ok"] { color: green; }
		#roundtrip[data-state="diff"] { color: crimson; }
	</style>
</head>
<body>
	<h1>Editor Card: Demo</h1>
	<p>
		Pick any instance from <code>ui/card/data/</code> — the editor loads its
		<code>schemaType</code> + <code>details</code>, and the round-trip readout compares
		the editor's value against the file until you edit something.
	</p>

	<div class="demo-controls">
		<label>Corpus instance
			<select id="instance"><option value="">— empty editor —</option></select>
		</label>
		<label class="toggle"><input type="checkbox" id="locked"> lock type</label>
		<output id="roundtrip"></output>
	</div>

	<editor-card id="editor"></editor-card>

	<script type="module">
		import './src/index.js';

		const editor = document.getElementById('editor');
		const picker = document.getElementById('instance');
		const locked = document.getElementById('locked');
		const readout = document.getElementById('roundtrip');
		let loaded = null;

		const index = await (await fetch('/ui/card/data/index.json')).json();
		for (const id of index.cards) picker.add(new Option(id, id));

		const report = () => {
			if (!loaded) { readout.textContent = ''; return; }
			const same = editor.value === JSON.stringify(loaded);
			readout.dataset.state = same ? 'ok' : 'diff';
			readout.textContent = same ? 'round-trip: byte-equal' : 'round-trip: edited (differs from file)';
		};

		picker.addEventListener('change', async () => {
			if (!picker.value) { loaded = null; editor.value = ''; report(); return; }
			const doc = await (await fetch(`/ui/card/data/${picker.value}.json`)).json();
			loaded = { schemaType: doc.fields?.schemaType ?? 'content', details: doc.fields?.details ?? {} };
			editor.value = loaded;
			report();
		});

		locked.addEventListener('change', () => editor.toggleAttribute('locked', locked.checked));
		editor.addEventListener('change', report);
	</script>
</body>
</html>
