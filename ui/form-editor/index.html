<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
	<title>Form Editor</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="description" content="Design a multi-step form and its rules visually. The output is two JSON files: the form definition and the rule set.">
	<link rel="stylesheet" href="/ui/base/index.css">
	<link rel="stylesheet" href="../step/ui-step.css">
	<link rel="stylesheet" href="../form-flow/index.css">
	<link rel="stylesheet" href="index.css">
	<style>body { margin: 0; max-inline-size: none; padding-inline: 2ch; }</style>
</head>
<body>
	<form-editor></form-editor>
	<script type="module">
		/* ?example=loan opens the advanced example, ?example=contact the field types example, ?example=order rows and calculations; each example keeps its own draft. */
		const examples = {
			insurance: { form: '../form-rules/examples/insurance.form.json', rules: '../form-rules/examples/insurance.rules.json', samples: '{ "offers": "../form-rules/examples/offers.patch.json" }' },
			loan: { form: '../form-rules/examples/loan.form.json', rules: '../form-rules/examples/loan.rules.json' },
			contact: { form: '../form-rules/examples/contact.form.json', rules: '../form-rules/examples/contact.rules.json' },
			'drug-ticket': { form: '../form-rules/examples/drug-ticket.form.json', rules: '../form-rules/examples/drug-ticket.rules.json' },
			order: { form: '../form-rules/examples/order.form.json', rules: '../form-rules/examples/order.rules.json', samples: '{ "cities": "../form-rules/examples/api/cities.json", "streets": "../form-rules/examples/api/streets.json" }' }
		};
		const example = examples[new URLSearchParams(location.search).get('example')] ?? examples.insurance;
		const editor = document.querySelector('form-editor');
		/* The installed field type packages (core is always there): country and format packages bring checks, widget packages controls. */
		editor.setAttribute('types', ['dk', 'banking', 'eu', 'postcodes', 'formats'].map(name => `../form-types/${name}/types.json`).concat(['rich-text', 'suggest', 'grid'].map(name => `../form-widgets/${name}/types.json`)).join(' '));
		/* Snippets: groups of fields (with their rules) offered in the same picker. */
		editor.setAttribute('snippets', 'snippets/address.json snippets/contact.json snippets/consent.json');
		Object.entries(example).forEach(([name, value]) => editor.setAttribute(name, value));
		await import('./index.js');
	</script>
</body>
</html>
