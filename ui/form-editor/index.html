<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
	<title>Form Editor</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="description" content="Design a multi-step form and its rules visually. The output is two JSON files: the form definition and the rule set.">
	<link rel="stylesheet" href="/ui/base/index.css">
	<link rel="stylesheet" href="../step/ui-step.css">
	<link rel="stylesheet" href="../form-flow/index.css">
	<link rel="stylesheet" href="index.css">
	<style>body { margin: 0; max-inline-size: none; padding-inline: 2ch; }</style>
</head>
<body>
	<form-editor></form-editor>
	<script type="module">
		/* ?example=loan opens the advanced example; each example keeps its own draft. */
		const examples = {
			insurance: { form: '../form-rules/examples/insurance.form.json', rules: '../form-rules/examples/insurance.rules.json', samples: '{ "offers": "../form-rules/examples/offers.patch.json" }' },
			loan: { form: '../form-rules/examples/loan.form.json', rules: '../form-rules/examples/loan.rules.json', functions: '../form-rules/examples/functions/checks.js' }
		};
		const example = examples[new URLSearchParams(location.search).get('example')] ?? examples.insurance;
		const editor = document.querySelector('form-editor');
		Object.entries(example).forEach(([name, value]) => editor.setAttribute(name, value));
		await import('./index.js');
	</script>
</body>
</html>
