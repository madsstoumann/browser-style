<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Carousels — 13 Dynamic dots</title>
	<!-- CodePen: add Pen 01's CSS as an external stylesheet (Settings → CSS) -->
	<link rel="stylesheet" href="../01-basics/style.css">
	<link rel="stylesheet" href="style.css">
	<!-- CodePen: add Pen 01's JS as an external script — the fallback for Safari/Firefox -->
	<script type="module" src="../01-basics/script.js"></script>
</head>
<body>
<!-- CodePen: HTML panel = everything inside <body>. CSS panel = style.css. -->
<main>
	<header>
		<h1>CSS Carousels — Dynamic dots</h1>
		<p>A scroll-driven animation that animates a <em>number</em> — and the dots do the maths.</p>
	</header>
	<div class="demos">
		<figure class="demo">
			<div class="carousel dynamic">
				<img src="https://v4.browser.style/assets/images/hubble.png" alt="Galaxy photographed by a space telescope" loading="lazy">
				<img src="https://v4.browser.style/assets/images/quantum.png" alt="Quantum computer" loading="lazy">
				<img src="https://v4.browser.style/assets/images/websummit.png" alt="Conference stage" loading="lazy">
				<img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy">
				<img src="https://v4.browser.style/assets/images/finance.png" alt="Charts on a desk" loading="lazy">
				<img src="https://v4.browser.style/assets/images/city.png" alt="City skyline" loading="lazy">
				<img src="https://v4.browser.style/assets/images/river.png" alt="River through a valley" loading="lazy">
				<img src="https://v4.browser.style/assets/images/mindfulness.png" alt="Person meditating in a forest" loading="lazy">
				<img src="https://v4.browser.style/assets/images/elephants.png" alt="Elephants on the savannah" loading="lazy">
				<img src="https://v4.browser.style/assets/images/hammershus.png" alt="Castle ruin on a cliff" loading="lazy">
				<img src="https://v4.browser.style/assets/images/spring.jpg" alt="Spring blossom" loading="lazy">
				<img src="https://v4.browser.style/assets/images/summer.jpg" alt="Summer beach" loading="lazy">
			</div>
			<figcaption><strong>Twelve slides, five dots</strong> — swipe and watch the strip glide.</figcaption>
		</figure>

		<figure class="demo">
			<div class="carousel dynamic no-arrows">
				<img src="https://v4.browser.style/assets/images/hubble.png" alt="Galaxy photographed by a space telescope" loading="lazy">
				<img src="https://v4.browser.style/assets/images/quantum.png" alt="Quantum computer" loading="lazy">
				<img src="https://v4.browser.style/assets/images/websummit.png" alt="Conference stage" loading="lazy">
				<img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy">
				<img src="https://v4.browser.style/assets/images/finance.png" alt="Charts on a desk" loading="lazy">
				<img src="https://v4.browser.style/assets/images/city.png" alt="City skyline" loading="lazy">
				<img src="https://v4.browser.style/assets/images/river.png" alt="River through a valley" loading="lazy">
			</div>
			<figcaption><strong>Seven slides</strong>, no arrows.</figcaption>
		</figure>
	</div>
</main>
</body>
</html>
