<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Carousels — 14 A gated quiz</title>
	<!-- CodePen: add Pen 01's CSS as an external stylesheet (Settings → CSS) -->
	<link rel="stylesheet" href="../01-basics/style.css">
	<link rel="stylesheet" href="style.css">
	<!-- CodePen: add Pen 01's JS as an external script — the fallback for Safari/Firefox -->
	<script type="module" src="../01-basics/script.js"></script>
</head>
<body>
<!-- CodePen: HTML panel = everything inside <body>. CSS panel = style.css. -->
<main>
	<header>
		<h1>CSS Carousels — A gated quiz</h1>
		<p><code>:has()</code> meets scroll-snap: the next slide appears when the question is answered.</p>
	</header>
	<div class="demos">
		<figure class="demo">
			<form class="carousel quiz">
				<fieldset data-label="1" aria-label="Question 1"><legend><small>Question 1 of 3</small>Which property makes a scroller snap?</legend><label><input type="radio" name="q1" value="correct" required> <code>scroll-snap-type</code></label><label><input type="radio" name="q1" value="wrong" required> <code>snap-scroll</code></label><label><input type="radio" name="q1" value="wrong" required> <code>overflow-snap</code></label><p class="feedback" aria-live="polite"><span class="right">Correct!</span><span class="wrong">Not quite: the green one is right.</span></p></fieldset>
				<fieldset data-label="2" aria-label="Question 2"><legend><small>Question 2 of 3</small>Which pseudo-element draws the dots?</legend><label><input type="radio" name="q2" value="wrong" required> <code>::scroll-dot</code></label><label><input type="radio" name="q2" value="correct" required> <code>::scroll-marker</code></label><label><input type="radio" name="q2" value="wrong" required> <code>::marker</code></label><p class="feedback" aria-live="polite"><span class="right">Correct!</span><span class="wrong">Not quite: the green one is right.</span></p></fieldset>
				<fieldset data-label="3" aria-label="Question 3"><legend><small>Question 3 of 3</small>Which pseudo-class marks the current dot?</legend><label><input type="radio" name="q3" value="wrong" required> <code>:current</code></label><label><input type="radio" name="q3" value="wrong" required> <code>:checked</code></label><label><input type="radio" name="q3" value="correct" required> <code>:target-current</code></label><p class="feedback" aria-live="polite"><span class="right">Correct!</span><span class="wrong">Not quite: the green one is right.</span></p></fieldset>
				<fieldset data-label="★" aria-label="Score"><legend><small>All done</small>Well played! 🎉</legend><p class="score">You got <span></span> of 3 right.</p><p>Every answer unlocked the next slide, and a CSS counter kept the score, without a single line of JavaScript.</p></fieldset>
			</form>
			<figcaption><strong>Answer to continue</strong> — <code>.quiz > :has(:invalid) ~ * { display: none; }</code>. A required radio group is <code>:invalid</code> until one is picked. Right and wrong are <code>:has([value="correct"]:checked)</code>, and the score is a CSS counter.</figcaption>
		</figure>
	</div>
</main>
</body>
</html>
