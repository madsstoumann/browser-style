<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Carousels — 05 Dots, pills and colourways</title>
	<!-- CodePen: add Pen 01's CSS as an external stylesheet (Settings → CSS) -->
	<link rel="stylesheet" href="../01-basics/style.css">
	<link rel="stylesheet" href="style.css">
	<!-- CodePen: add Pen 01's JS as an external script — the fallback for Safari/Firefox -->
	<script type="module" src="../01-basics/script.js"></script>
</head>
<body>
<!-- CodePen: HTML panel = everything inside <body>. CSS panel = style.css. -->
<main>
	<header>
		<h1>CSS Carousels — Dots, pills and colourways</h1>
		<p>A marker is a box — and a pseudo-element <em>of its slide</em>, so it can inherit from it.</p>
	</header>
	<div class="demos">
		<figure class="demo">
			<div class="carousel no-arrows dots-lg">
				<img src="https://v4.browser.style/assets/images/hubble.png" alt="Galaxy photographed by a space telescope" loading="lazy">
				<img src="https://v4.browser.style/assets/images/quantum.png" alt="Quantum computer" loading="lazy">
				<img src="https://v4.browser.style/assets/images/websummit.png" alt="Conference stage" loading="lazy">
				<img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy">
			</div>
			<figcaption><strong>Bigger dots</strong> — <code>--dot-size: 0.8rem</code>.</figcaption>
		</figure>

		<figure class="demo">
			<div class="carousel no-arrows dots-pill">
				<img src="https://v4.browser.style/assets/images/mindfulness.png" alt="Person meditating in a forest" loading="lazy">
				<img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy">
				<img src="https://v4.browser.style/assets/images/city.png" alt="City skyline" loading="lazy">
				<img src="https://v4.browser.style/assets/images/river.png" alt="River through a valley" loading="lazy">
			</div>
			<figcaption><strong>Pill timer</strong> — the current pill fills over <code>--autoplay</code>. Pair it with autoplay JS, or let it hint “time to swipe”.</figcaption>
		</figure>

		<figure class="demo">
			<div class="carousel no-arrows dots-hybrid">
				<img src="https://v4.browser.style/assets/images/elephants.png" alt="Elephants on the savannah" loading="lazy">
				<img src="https://v4.browser.style/assets/images/hammershus.png" alt="Castle ruin on a cliff" loading="lazy">
				<img src="https://v4.browser.style/assets/images/autumn.jpg" alt="Autumn leaves" loading="lazy">
				<img src="https://v4.browser.style/assets/images/winter.jpg" alt="Snowy forest" loading="lazy">
			</div>
			<figcaption><strong>Hybrid</strong> — dots, but the current one stretches.</figcaption>
		</figure>

		<figure class="demo">
			<div class="carousel dots-lg dots-ring" style="--carousel-ratio: 3 / 4">
				<img src="https://v4.browser.style/assets/images/phone-blue.svg" alt="Phone in blue" style="--dot-bg: color-mix(in oklab, #2f6fe0 45%, #0000); --dot-active: #2f6fe0">
				<img src="https://v4.browser.style/assets/images/phone-orange.svg" alt="Phone in orange" style="--dot-bg: color-mix(in oklab, #f2782a 45%, #0000); --dot-active: #f2782a">
				<img src="https://v4.browser.style/assets/images/phone-green.svg" alt="Phone in green" style="--dot-bg: color-mix(in oklab, #2ea36b 45%, #0000); --dot-active: #2ea36b">
			</div>
			<figcaption><strong>Colourways</strong> — every slide colours its own dot.</figcaption>
		</figure>
	</div>
</main>
</body>
</html>
