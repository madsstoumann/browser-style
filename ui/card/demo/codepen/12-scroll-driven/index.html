<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Carousels — 12 Scroll-driven</title>
	<!-- CodePen: add Pen 01's CSS as an external stylesheet (Settings → CSS) -->
	<link rel="stylesheet" href="../01-basics/style.css">
	<link rel="stylesheet" href="style.css">
	<!-- CodePen: add Pen 01's JS as an external script — the fallback for Safari/Firefox -->
	<script type="module" src="../01-basics/script.js"></script>
</head>
<body>
<!-- CodePen: HTML panel = everything inside <body>. CSS panel = style.css. -->
<main>
	<header>
		<h1>CSS Carousels — Scroll-driven</h1>
		<p>Animations that run on a scroll timeline instead of a clock — and one that the scroll merely <em>starts</em>.</p>
	</header>
	<div class="demos">
		<figure class="demo">
			<div class="carousel cards reveal">
				<div class="slide" role="group" aria-label="Deep space"><article class="card"><img src="https://v4.browser.style/assets/images/hubble.png" alt="Galaxy photographed by a space telescope" loading="lazy"><h3>Deep space</h3></article></div>
				<div class="slide" role="group" aria-label="Quantum"><article class="card"><img src="https://v4.browser.style/assets/images/quantum.png" alt="Quantum computer" loading="lazy"><h3>Quantum</h3></article></div>
				<div class="slide" role="group" aria-label="Web Summit"><article class="card"><img src="https://v4.browser.style/assets/images/websummit.png" alt="Conference stage" loading="lazy"><h3>Web Summit</h3></article></div>
				<div class="slide" role="group" aria-label="Atlas"><article class="card"><img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy"><h3>Atlas</h3></article></div>
				<div class="slide" role="group" aria-label="Finance"><article class="card"><img src="https://v4.browser.style/assets/images/finance.png" alt="Charts on a desk" loading="lazy"><h3>Finance</h3></article></div>
				<div class="slide" role="group" aria-label="Cities"><article class="card"><img src="https://v4.browser.style/assets/images/city.png" alt="City skyline" loading="lazy"><h3>Cities</h3></article></div>
				<div class="slide" role="group" aria-label="Rivers"><article class="card"><img src="https://v4.browser.style/assets/images/river.png" alt="River through a valley" loading="lazy"><h3>Rivers</h3></article></div>
				<div class="slide" role="group" aria-label="Breathe"><article class="card"><img src="https://v4.browser.style/assets/images/mindfulness.png" alt="Person meditating in a forest" loading="lazy"><h3>Breathe</h3></article></div>
				<div class="slide" role="group" aria-label="Savannah"><article class="card"><img src="https://v4.browser.style/assets/images/elephants.png" alt="Elephants on the savannah" loading="lazy"><h3>Savannah</h3></article></div>
			</div>
			<figcaption><strong>Scroll-driven</strong> — a <code>view-timeline</code> per slide. Scroll slowly: the cards scale in as they enter. Scroll back: they rewind.</figcaption>
		</figure>
	</div>

	<div class="demos">
		<figure class="demo">
			<div class="carousel cards no-dots with-progress">
				<div class="slide" role="group" aria-label="Deep space"><article class="card"><img src="https://v4.browser.style/assets/images/hubble.png" alt="Galaxy photographed by a space telescope" loading="lazy"><h3>Deep space</h3></article></div>
				<div class="slide" role="group" aria-label="Quantum"><article class="card"><img src="https://v4.browser.style/assets/images/quantum.png" alt="Quantum computer" loading="lazy"><h3>Quantum</h3></article></div>
				<div class="slide" role="group" aria-label="Web Summit"><article class="card"><img src="https://v4.browser.style/assets/images/websummit.png" alt="Conference stage" loading="lazy"><h3>Web Summit</h3></article></div>
				<div class="slide" role="group" aria-label="Atlas"><article class="card"><img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy"><h3>Atlas</h3></article></div>
				<div class="slide" role="group" aria-label="Finance"><article class="card"><img src="https://v4.browser.style/assets/images/finance.png" alt="Charts on a desk" loading="lazy"><h3>Finance</h3></article></div>
				<div class="slide" role="group" aria-label="Cities"><article class="card"><img src="https://v4.browser.style/assets/images/city.png" alt="City skyline" loading="lazy"><h3>Cities</h3></article></div>
				<div class="slide" role="group" aria-label="Rivers"><article class="card"><img src="https://v4.browser.style/assets/images/river.png" alt="River through a valley" loading="lazy"><h3>Rivers</h3></article></div>
				<div class="slide" role="group" aria-label="Breathe"><article class="card"><img src="https://v4.browser.style/assets/images/mindfulness.png" alt="Person meditating in a forest" loading="lazy"><h3>Breathe</h3></article></div>
				<div class="slide" role="group" aria-label="Savannah"><article class="card"><img src="https://v4.browser.style/assets/images/elephants.png" alt="Elephants on the savannah" loading="lazy"><h3>Savannah</h3></article></div>
			</div>
			<div class="progress"></div>
			<figcaption><strong>A named timeline</strong> — the line fills as you scroll, from the first page to the last. It lives <em>outside</em> the carousel, so <code>timeline-scope</code> shares the name.</figcaption>
		</figure>
	</div>

	<div class="demos">
		<figure class="demo">
			<div class="carousel cards trigger">
				<div class="slide" role="group" aria-label="Deep space"><article class="card"><img src="https://v4.browser.style/assets/images/hubble.png" alt="Galaxy photographed by a space telescope" loading="lazy"><h3>Deep space</h3></article></div>
				<div class="slide" role="group" aria-label="Quantum"><article class="card"><img src="https://v4.browser.style/assets/images/quantum.png" alt="Quantum computer" loading="lazy"><h3>Quantum</h3></article></div>
				<div class="slide" role="group" aria-label="Web Summit"><article class="card"><img src="https://v4.browser.style/assets/images/websummit.png" alt="Conference stage" loading="lazy"><h3>Web Summit</h3></article></div>
				<div class="slide" role="group" aria-label="Atlas"><article class="card"><img src="https://v4.browser.style/assets/images/world.png" alt="Globe" loading="lazy"><h3>Atlas</h3></article></div>
				<div class="slide" role="group" aria-label="Finance"><article class="card"><img src="https://v4.browser.style/assets/images/finance.png" alt="Charts on a desk" loading="lazy"><h3>Finance</h3></article></div>
				<div class="slide" role="group" aria-label="Cities"><article class="card"><img src="https://v4.browser.style/assets/images/city.png" alt="City skyline" loading="lazy"><h3>Cities</h3></article></div>
				<div class="slide" role="group" aria-label="Rivers"><article class="card"><img src="https://v4.browser.style/assets/images/river.png" alt="River through a valley" loading="lazy"><h3>Rivers</h3></article></div>
				<div class="slide" role="group" aria-label="Breathe"><article class="card"><img src="https://v4.browser.style/assets/images/mindfulness.png" alt="Person meditating in a forest" loading="lazy"><h3>Breathe</h3></article></div>
				<div class="slide" role="group" aria-label="Savannah"><article class="card"><img src="https://v4.browser.style/assets/images/elephants.png" alt="Elephants on the savannah" loading="lazy"><h3>Savannah</h3></article></div>
			</div>
			<figcaption><strong>Scroll-triggered</strong> — <code>timeline-trigger</code>: entering the view <em>starts</em> a normal, timed animation. It plays once, and stays.</figcaption>
		</figure>
	</div>
</main>
</body>
</html>
