<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
	<title>AuraSound Pro Wireless Headphones</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="Industry-leading noise cancellation, 30-hour battery and multipoint pairing.">
	<link rel="stylesheet" href="/dist/demo.min.css">
	<!-- srcset uses absolute v4.browser.style CDN URLs; the zone's Hotlink Protection
	     403s any cross-origin Referer (pages.dev, localhost) — no-referrer passes -->
	<meta name="referrer" content="no-referrer">
	<link rel="preconnect" href="https://v4.browser.style">
	<!-- Block first paint (and the view-transition snapshot) until the hero is parsed,
	     so the card/hero morph targets exist when the browser captures the incoming
	     page. Without this the snapshot races HTML parsing and the morph degrades to a
	     plain cross-fade on repeat/bfcache navigations. -->
	<link rel="expect" href="#hero" blocking="render">
	<!-- Names the morph targets where typed attr() is unsupported (Safari). MUST be
	     render-blocking in <head>: the incoming page is snapshotted at first paint,
	     so a deferred script names the targets too late and the forward morph
	     degrades to a cross-fade. Docs: ui/base/polyfills/readme.md -->
	<script type="module" src="/ui/base/polyfills/attr-fallback.js" blocking="render"></script>
	<style>
		/* cross-document view transitions (@view-transition, the [data-view] attr()
		   naming rule and group timing) come from ui-card.css — nothing page-scoped
		   here, deliberately: see the header comment in products/build.js */
		body { margin-inline: auto; max-inline-size: 64rem; }
		.product-view { margin-block-end: var(--spacing-2xl); }
	</style>
	<style>
		:root {
			--color-link: light-dark(hsl(221, 100%, 44%), hsl(221, 70%, 70%));
			--color-accent: light-dark(hsl(211, 100%, 38%), hsl(211, 70%, 72%));
			--color-success: light-dark(hsl(136, 45%, 30%), hsl(136, 25%, 60%));
			--color-error: light-dark(hsl(360, 65%, 41%), hsl(360, 45%, 62%));
			--color-text-muted: light-dark(hsl(0, 0%, 42%), hsl(0, 0%, 65%));
		}
		ui-content { --ui-content-muted: color-mix(in oklab, currentColor 85%, transparent); }
		ui-chip[data-type] { --ui-chip-bg: hsl(0, 0%, 95%); --ui-chip-c: hsl(0, 0%, 13%); }
	</style>
</head>
<body>
	<main>
		<ui-card class="product-view" data-view="card-product-1" variant="col lg:row lg:spl(1/1) shd(non)" itemscope itemtype="https://schema.org/Product">
		<cq-box>
			<ui-media media="asr(4/3) rds(lg) sticker(te) sticker(red) sticker(2xl) sticker(sh:burst) save(be)" id="product-1-media"><img id="hero" data-view="hero-product-1" src="/assets/images/aurasoundpro.png" alt="AuraSound Pro wireless headphones" srcset="https://v4.browser.style/cdn-cgi/image/format=auto,quality=80,fit=cover,width=240,height=180/assets/images/aurasoundpro.png 240w, https://v4.browser.style/cdn-cgi/image/format=auto,quality=80,fit=cover,width=320,height=240/assets/images/aurasoundpro.png 320w, https://v4.browser.style/cdn-cgi/image/format=auto,quality=80,fit=cover,width=480,height=360/assets/images/aurasoundpro.png 480w, https://v4.browser.style/cdn-cgi/image/format=auto,quality=80,fit=cover,width=720,height=540/assets/images/aurasoundpro.png 720w, https://v4.browser.style/cdn-cgi/image/format=auto,quality=80,fit=cover,width=1200,height=900/assets/images/aurasoundpro.png 1200w" sizes="(min-width: 720px) 30rem, 100vw" loading="eager" fetchpriority="high" decoding="async" itemprop="image"><ui-sticker><small>SAVE</small><strong>20%</strong></ui-sticker><ui-save><button type="button" command="--save" commandfor="product-1-media" aria-label="Save AuraSound Pro Wireless Headphones to favorites"><ui-icon type="shape" shape="heart" variant="outline"></ui-icon></button></ui-save></ui-media>
			<ui-content content="scl(lg)"><small data-part="eyebrow" itemprop="category">Electronics</small><h2 data-part="headline" itemprop="name">AuraSound Pro Wireless Headphones</h2><p data-part="summary" itemprop="description">Industry-leading noise cancellation, 30-hour battery and multipoint pairing.</p><div data-part="rating" itemprop="aggregateRating" itemscope itemtype="https://schema.org/AggregateRating">
		<meta itemprop="ratingValue" content="4.5">
		<meta itemprop="ratingCount" content="1247">
		<meta itemprop="bestRating" content="5"><meta itemprop="worstRating" content="1">
		<input class="ui-rating" type="range" min="1" max="5" value="4.5" step="0.01" disabled aria-hidden="true">
		<span data-sr>Rated 4.5 out of 5 stars from 1,247 ratings</span>
		<span aria-hidden="true">4.5 / 5 (1,247 ratings)</span>
	</div><p data-part="price" itemprop="offers" itemscope itemtype="https://schema.org/Offer">
				<meta itemprop="priceCurrency" content="USD"><meta itemprop="availability" content="https://schema.org/InStock"><meta itemprop="itemCondition" content="https://schema.org/NewCondition"><meta itemprop="priceValidUntil" content="2026-08-01">
				<meta itemprop="price" content="279">$279 <del>$349</del> <ui-chip theme="pale green">Save 20%</ui-chip>
			</p><p data-part="meta"><small>Valid until Aug 1, 2026</small></p><p data-part="meta"><ui-chip theme="pale green">In Stock</ui-chip></p><meta itemprop="sku" content="WH-1000XM5"><span data-part="tags"><ui-chip itemprop="keywords">Wireless</ui-chip><ui-chip itemprop="keywords">Noise Cancelling</ui-chip></span><nav data-part="actions"><button class="ui-button" type="button" data-variant="accent" aria-label="Add AuraSound Pro to cart">Add to cart</button></nav></ui-content>
		</cq-box>
	</ui-card>
	</main>
	<!-- Native scroll-control pseudos do NOT follow a popover frame into the top layer
	     (Chromium), so the open lightbox gets real DOM controls from this module. Non
	     render-blocking: it must not delay the transition snapshot. Docs: docs/media.md -->
	<script type="module" src="/ui/card/lightbox.min.js"></script>
</body>
</html>
