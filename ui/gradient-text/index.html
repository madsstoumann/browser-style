<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
	<title>Gradient Text</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="description" content="HTML is the foundation of the World Wide Web, and it is still the most popular markup language in use today.">
	<meta name="view-transition" content="same-origin">
	<link rel="stylesheet" href="/ui/base/index.css">
	<link rel="stylesheet" href="ui-gradient-text.css">
	<style>
		/* For demo */
		.h0 {
			font-size: 5em;
			font-weight: 900;
			letter-spacing: -0.05em;
			line-height: 1.1;
			margin: 0;
			text-wrap: pretty;
		}
	</style>
</head>
<body>
	<h1>UI: Components</h1>

	<h2>Gradient Text</h2>
	<p>
		<strong>Gradient Text</strong> is a custom element with a gradient color effect.<br>
		To create a custom gradient, update the custom attributes <code>gradient</code>, <code>size</code> and <code>animate</code>.
	</p>

	<h3 class="h0">
		Add <ui-gradient-text>gradient text</ui-gradient-text> anywhere
	</h3>

	<h3 class="h0">
		<ui-gradient-text gradient="#7f00de, #ff007e, #7f00de" size="150%">
			Jumps over the lazy dog
		</ui-gradient-text>
	</h3>

	<h3 class="h0">
		<ui-gradient-text animate="breathe" gradient="#ff1834, #ffc900, #ff1834" size="250%">
			Sunset Gradient
		</ui-gradient-text>
	</h3>

	<h3 class="h0">
		<ui-gradient-text animate="slide" gradient="#ff3e41, #ff8a43, #ffeb7f, #00c9a7, #007ea7, #ff3e41" size="120%">
			Rainbow Gradient
		</ui-gradient-text>
	</h3>

</body>
</html>
