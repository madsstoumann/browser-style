<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head>
	<title>Save — Web Component</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="description" content="Web component demo for ui-save">
	<meta name="view-transition" content="same-origin">
	<link rel="stylesheet" href="/ui/base/index.css">
	<link rel="stylesheet" href="/ui/icon/ui-icon.css">
	<link rel="stylesheet" href="ui-save.css">
</head>
<body>
	<h1>UI: Save</h1>

	<h2>Web Component</h2>
	<p>
		<code>&lt;ui-save&gt;</code> registered as a custom element. The element only registers
		itself; the toggle is driven by the button's <code>command="--save"</code> invoker. The
		delegated listener below flips <code>aria-pressed</code> — try clicking the toggles.
	</p>

	<h3>Heart (default)</h3>
	<div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
		<ui-save id="w1"><button type="button" command="--save" commandfor="w1" aria-label="Add to favorites"><ui-icon type="shape" shape="heart" variant="outline"></ui-icon></button></ui-save>
		<ui-save id="w2"><button type="button" command="--save" commandfor="w2" aria-label="Add to favorites" aria-pressed="true"><ui-icon type="shape" shape="heart" variant="outline"></ui-icon></button></ui-save>
	</div>

	<h3>Shapes</h3>
	<div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
		<ui-save id="w3"><button type="button" command="--save" commandfor="w3" aria-label="Bookmark"><ui-icon type="shape" shape="bookmark" variant="outline"></ui-icon></button></ui-save>
		<ui-save id="w4" style="--ui-save-c-active: gold;"><button type="button" command="--save" commandfor="w4" aria-label="Wishlist"><ui-icon type="shape" shape="star" variant="outline"></ui-icon></button></ui-save>
	</div>

	<h3>Sizes</h3>
	<div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
		<ui-save id="w5" size="sm"><button type="button" command="--save" commandfor="w5" aria-label="Favorite"><ui-icon type="shape" shape="heart" variant="outline"></ui-icon></button></ui-save>
		<ui-save id="w6" size="md"><button type="button" command="--save" commandfor="w6" aria-label="Favorite"><ui-icon type="shape" shape="heart" variant="outline"></ui-icon></button></ui-save>
		<ui-save id="w7" size="lg"><button type="button" command="--save" commandfor="w7" aria-label="Favorite"><ui-icon type="shape" shape="heart" variant="outline"></ui-icon></button></ui-save>
	</div>

	<script type="module">
		import './index.js';

		// Author glue: command does not bubble, so listen in the capture phase.
		document.addEventListener('command', (e) => {
			if (e.command !== '--save') return;
			const btn = e.source;
			const saved = btn.getAttribute('aria-pressed') !== 'true';
			btn.setAttribute('aria-pressed', saved);
		}, true);
	</script>
</body>
</html>
