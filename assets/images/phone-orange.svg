<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="Dummy phone — orange">
	<defs>
		<radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fef3ea"/><stop offset="1" stop-color="#fbdcc4"/></radialGradient>
		<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9b07c"/><stop offset=".45" stop-color="#f2782a"/><stop offset="1" stop-color="#c95712"/></linearGradient>
		<linearGradient id="frame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c95712"/><stop offset=".5" stop-color="#f9b07c"/><stop offset="1" stop-color="#c95712"/></linearGradient>
		<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2782a"/><stop offset=".55" stop-color="#c95712"/><stop offset="1" stop-color="#101418"/></linearGradient>
		<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
		<filter id="shadow" x="-30%" y="-20%" width="160%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#c95712" flood-opacity=".35"/></filter>
	</defs>
	<rect width="900" height="1200" fill="url(#bg)"/>
	<ellipse cx="450" cy="1060" rx="330" ry="34" fill="#c95712" opacity=".18"/>
	<!-- back, tilted behind -->
	<g transform="rotate(-8 520 600)" filter="url(#shadow)">
		<rect x="380" y="200" width="320" height="660" rx="52" fill="url(#frame)"/>
		<rect x="386" y="206" width="308" height="648" rx="47" fill="url(#back)"/>
		<rect x="410" y="232" width="150" height="150" rx="38" fill="#c95712" opacity=".55"/>
		<rect x="410" y="232" width="150" height="150" rx="38" fill="none" stroke="#f9b07c" stroke-opacity=".6" stroke-width="3"/>
		<circle cx="452" cy="274" r="30" fill="#14181d" stroke="#f9b07c" stroke-width="5"/><circle cx="452" cy="274" r="13" fill="#2b3440"/><circle cx="446" cy="268" r="4" fill="#fff" opacity=".7"/>
		<circle cx="452" cy="340" r="30" fill="#14181d" stroke="#f9b07c" stroke-width="5"/><circle cx="452" cy="340" r="13" fill="#2b3440"/><circle cx="446" cy="334" r="4" fill="#fff" opacity=".7"/>
		<circle cx="518" cy="307" r="30" fill="#14181d" stroke="#f9b07c" stroke-width="5"/><circle cx="518" cy="307" r="13" fill="#2b3440"/><circle cx="512" cy="301" r="4" fill="#fff" opacity=".7"/>
		<circle cx="530" cy="250" r="7" fill="#fff6d8" opacity=".9"/>
		<circle cx="540" cy="540" r="34" fill="none" stroke="#c95712" stroke-opacity=".35" stroke-width="6"/>
		<rect x="386" y="206" width="308" height="648" rx="47" fill="url(#gloss)"/>
	</g>
	<!-- front -->
	<g transform="rotate(4 360 620)" filter="url(#shadow)">
		<rect x="196" y="262" width="12" height="70" rx="5" fill="#c95712"/>
		<rect x="196" y="352" width="12" height="110" rx="5" fill="#c95712"/>
		<rect x="512" y="380" width="12" height="130" rx="5" fill="#c95712"/>
		<rect x="200" y="220" width="320" height="660" rx="52" fill="url(#frame)"/>
		<rect x="208" y="228" width="304" height="644" rx="45" fill="#0c0f12"/>
		<rect x="220" y="240" width="280" height="620" rx="36" fill="url(#screen)"/>
		<rect x="318" y="258" width="84" height="24" rx="12" fill="#0c0f12"/>
		<text x="246" y="276" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fff">9:41</text>
		<text x="360" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="78" font-weight="300" fill="#fff">9:41</text>
		<text x="360" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#fff" opacity=".8">Thursday 8 October</text>
		<circle cx="300" cy="640" r="120" fill="#f9b07c" opacity=".35"/>
		<circle cx="430" cy="720" r="90" fill="#f2782a" opacity=".5"/>
		<rect x="310" y="836" width="100" height="6" rx="3" fill="#fff" opacity=".8"/>
		<rect x="220" y="240" width="280" height="620" rx="36" fill="url(#gloss)"/>
	</g>
